<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Outer circle shadow -->
  <g filter="url(#shadow)">
    <!-- Surgical tape spool -->
    <ellipse cx="250" cy="245" rx="150" ry="110" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
    <ellipse cx="250" cy="240" rx="145" ry="105" fill="#FFFFFF"/>
    
    <!-- Tape layers -->
    <ellipse cx="250" cy="240" rx="130" ry="92" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
    <ellipse cx="250" cy="238" rx="115" ry="80" fill="#F8FAFC"/>
    
    <!-- Core hole -->
    <ellipse cx="250" cy="238" rx="65" ry="46" fill="#0284C7" opacity="0.15"/>
    <ellipse cx="250" cy="236" rx="60" ry="42" fill="#0369A1" opacity="0.85"/>
    <ellipse cx="250" cy="234" rx="55" ry="38" fill="#F8FAFC"/>
    
    <!-- Extended tape peel -->
    <path d="M 365 240 Q 400 270 420 320 L 375 335 Q 355 285 320 260 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  
  <!-- Medical Badge -->
  <rect x="140" y="385" width="220" height="42" rx="21" fill="#0284C7" filter="url(#shadow)"/>
  <text x="250" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CINTA HIPOALERGÉNICA</text>
  <text x="250" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Rollo x 1 unidad · Grado Médico</text>
</svg>
