<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <g filter="url(#shadow)">
    <!-- Medical kit box icon -->
    <rect x="140" y="150" width="220" height="170" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Handle -->
    <path d="M 200 150 L 200 120 C 200 110 210 100 220 100 L 280 100 C 290 100 300 110 300 120 L 300 150" fill="none" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Red/Blue Medical Cross -->
    <rect x="235" y="195" width="30" height="80" rx="6" fill="#0284C7"/>
    <rect x="210" y="220" width="80" height="30" rx="6" fill="#0284C7"/>
  </g>
  
  <!-- Badge -->
  <rect x="130" y="380" width="240" height="42" rx="21" fill="#64748B" filter="url(#shadow)"/>
  <text x="250" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">INSUMO MÉDICO</text>
  <text x="250" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">UMSA Centro Médico · Sin imagen asignada</text>
</svg>
