<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <g filter="url(#shadow)">
    <!-- Surgical bouffant cap / cofia descartable -->
    <!-- Elastic band base -->
    <ellipse cx="250" cy="285" rx="150" ry="40" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="250" cy="282" rx="146" ry="36" fill="#F1F5F9"/>
    
    <!-- Puffed cap body (blue non-woven fabric) -->
    <path d="M 115 270 C 100 170 170 115 250 115 C 330 115 400 170 385 270 C 375 295 340 305 250 305 C 160 305 125 295 115 270 Z" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2"/>
    
    <!-- Pleats / folds of the cap -->
    <path d="M 145 255 C 160 190 200 150 240 145" fill="none" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 210 270 C 225 180 250 135 275 140" fill="none" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 285 270 C 295 190 325 155 350 175" fill="none" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Elastic frill details -->
    <path d="M 105 275 Q 125 285 145 278 Q 165 290 185 282 Q 205 292 225 283 Q 245 293 265 284 Q 285 293 305 284 Q 325 292 345 282 Q 365 290 385 278 Q 395 283 400 275" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Medical Badge -->
  <rect x="145" y="385" width="210" height="42" rx="21" fill="#0284C7" filter="url(#shadow)"/>
  <text x="250" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">COFIAS DESCARTABLES</text>
  <text x="250" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">Paquete x 100 U · Tela no tejida</text>
</svg>
