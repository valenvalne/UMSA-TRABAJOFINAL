<!-- ÁREA INTERACTIVA (PANELES DINÁMICOS) -->
<section class="interactive-area" aria-live="polite">
  <!-- PANEL DE SOLICITUD DE TURNO -->
  <div class="panel" id="turno-panel" hidden>
    <div class="panel-heading">
      <div>
        <p class="eyebrow">RESERVA ONLINE</p>
        <h2>Solicitar turno</h2>
      </div>
      <button class="close-panel" type="button" aria-label="Cerrar formulario" data-close-panel>×</button>
    </div>

    <form id="turno-form" method="POST" action="{% url 'crear_turno' %}" novalidate>
      {% csrf_token %}
      <div class="form-grid">
        <label class="field field-wide" for="turno-nombre">
          <span>Nombre y apellido</span>
          <input type="text" name="nombre" id="turno-nombre" autocomplete="name" required minlength="3"
            placeholder="Ej.: Ana García" />
        </label>
        <label class="field" for="turno-dni">
          <span>DNI</span>
          <input type="text" name="dni" id="turno-dni" inputmode="numeric" autocomplete="off" required
            pattern="[0-9]{7,8}" placeholder="Sin puntos" />
        </label>
        <label class="field" for="turno-telefono">
          <span>Teléfono</span>
          <input type="tel" name="telefono" id="turno-telefono" autocomplete="tel" required
            placeholder="Ej.: 2325 400000" />
        </label>
        <label class="field" for="especialidad">
          <span>Especialidad</span>
          <select name="especialidad" id="especialidad" required>
            <option value="">Seleccionar</option>
            <option value="Clínica Médica">Clínica Médica</option>
            <option value="Odontología">Odontología</option>
            <option value="Reumatología">Reumatología</option>
            <option value="Neurología">Neurología</option>
          </select>
        </label>
        <label class="field" for="profesional">
          <span>Profesional</span>
          <input type="text" name="profesional" id="profesional" required readonly
            placeholder="Se completa automáticamente" />
        </label>
        <label class="field" for="fecha">
          <span>Fecha</span>
          <input type="date" name="fecha" id="fecha" required />
        </label>
        <label class="field" for="hora">
          <span>Horario</span>
          <select name="hora" id="hora" required>
            <option value="">Seleccionar</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
          </select>
        </label>
      </div>
      <p class="form-note">Todos los campos son obligatorios.</p>
      <div id="turno-error" class="form-message error-message" role="alert" hidden></div>
      <button class="submit-button" type="submit" id="btn-confirmar-turno">CONFIRMAR TURNO</button>
    </form>
  </div>

  <!-- PANEL DE CONSULTA DE TURNO -->
  <div class="panel" id="consulta-panel" hidden>
    <div class="panel-heading">
      <div>
        <p class="eyebrow">ESTADO DEL TURNO</p>
        <h2>Consultar turno</h2>
      </div>
      <button class="close-panel" type="button" aria-label="Cerrar consulta" data-close-panel>×</button>
    </div>
    <form id="consulta-form" class="search-form" novalidate>
      <label class="field" for="consulta-dni">
        <span>DNI del paciente</span>
        <input type="text" name="dni" id="consulta-dni" inputmode="numeric" required pattern="[0-9]{7,8}"
          placeholder="Ingresá el DNI sin puntos" />
      </label>
      <button class="submit-button" type="submit" id="btn-buscar-turno">BUSCAR TURNO</button>
    </form>
    <div id="consulta-error" class="form-message error-message" role="alert" hidden></div>
    <div id="consulta-resultado" class="result-area" aria-live="polite"></div>
  </div>

  <!-- CONFIRMACIÓN DE TURNO -->
  <div id="confirmacion" class="confirmation" hidden tabindex="-1">
    <div class="confirmation-icon" aria-hidden="true">✓</div>
    <div>
      <p class="eyebrow">ESTADO DEL TURNO</p>
      <h2>Turno solicitado correctamente</h2>
      <p>Recibimos la solicitud. La secretaría podrá comunicarse para validar la disponibilidad.</p>
      <dl id="confirmacion-detalle" class="appointment-detail"></dl>
      <button class="text-button" type="button" data-new-appointment>Solicitar otro turno</button>
    </div>
  </div>
</section>
